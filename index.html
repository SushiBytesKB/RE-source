<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>RE-source</title>
    <style>
       
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">RE-source</div>
        </nav>
    </header>

    <div class="container">
        <h1>RE-source</h1>
        <div class="cards">
            <div class="card">
                <form>
                    <h3><label for="improvement">AI to Improve:</label></h3>
                    <select id="improvement" name="improvements">
                        <option value="cut emissions">Cut emissions</option>
                        <option value="cut budget">Cut budget</option>
                    </select>
                </form>
            </div>
            <div class="card">
                <h3><label for="BudgetCap">Option1</label></h3>
                <input type="text" id="BudgetCap" name="BudgetCap" placeholder="Option1">
            </div>
            <div class="card">
                <h3><label for="ExpectedEmissions">Option2</label></h3>
                <input type="text" id="ExpectedEmissions" name="ExpectedEmissions" placeholder="Option2">
            </div>
            <div class="card">
                <h3><label for="Option3">Option3</label></h3>
                <input type="text" id="Option3" name="Option3" placeholder="Option3">
            </div>
        </div>

        <section class="hero">
            <a href="#" class="btn">Submit</a>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 RE-source. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
